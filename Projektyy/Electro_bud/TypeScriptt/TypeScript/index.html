<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ElektroBud</title>
	<link rel="stylesheet" href="public/main.css">
</head>
<body>
    <h1>ElektroBud</h1>
    <div id="addProductForm">
        <h2>Dodawanie produktów</h2>
        <label for="name">Nazwa:</label>
        <input type="text" id="name" name="name"><br>
        <label for="category">Kategoria:</label>
        <input type="text" id="category" name="category"><br>
        <label for="ean">Kod EAN:</label>
        <input type="text" id="ean" name="ean"><br>
        <label for="location">Lokalizacja:</label>
        <select id="location" name="location">
            <option value="sektor">S(Sektor)</option>
            <option value="regal">R(Regal)</option>
            <option value="polka">P(Półka)</option>
        </select><br>
        <button id="addButton">Dodaj produkt</button>
    </div>

	<div id="addedProducts">

	</div>

	<script src="public/main.js"></script>
</body>
</html>
